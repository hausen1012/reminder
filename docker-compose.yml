version: '3.8'

services:
  reminder:
    build: .
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - reminder-data:/data/db
    environment:
      - PORT=8080
      - DB_PATH=/data/db/reminder.db
      - JWT_SECRET=${JWT_SECRET}
      - INIT_USERNAME=${INIT_USERNAME:-admin}
      - INIT_PASSWORD=${INIT_PASSWORD:-admin123}
      - SECRET_BOX_KEY=${SECRET_BOX_KEY}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-http://localhost:8080}
      - TIMEZONE=${TIMEZONE:-Asia/Shanghai}
      - SWEEP_INTERVAL_SEC=${SWEEP_INTERVAL_SEC:-60}
      - MISS_TOLERANCE_MINUTES=${MISS_TOLERANCE_MINUTES:-60}
      - LOG_AUTO_PURGE_DAYS=${LOG_AUTO_PURGE_DAYS:-0}
      - LOG_FILE=${LOG_FILE}

volumes:
  reminder-data:
