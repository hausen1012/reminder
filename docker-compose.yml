version: '3.8'

services:
  reminder:
    build: .
    ports:
      - "${PORT:-8765}:8765"
    volumes:
      - ./reminder/db:/data/db
      - ./reminder/log:/var/log/reminder
    environment:
      - PORT=8765
      - USERNAME=${USERNAME:-admin}
      - PASSWORD=${PASSWORD:-admin123}
      - DB_PATH=/data/db/reminder.db
      # JWT_SECRET 留空时由程序随机生成；不要填 changeme 之类的弱值
      - JWT_SECRET=${JWT_SECRET:-}
      # 留空时使用内置 fallback（等同于不加密），生产环境务必配置
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      - SITE_URL=${SITE_URL:-http://localhost:8765}
      - TIMEZONE=${TIMEZONE:-Asia/Shanghai}
      - SWEEP_INTERVAL_SEC=${SWEEP_INTERVAL_SEC:-60}
      - MISS_TOLERANCE_MINUTES=${MISS_TOLERANCE_MINUTES:-60}
      - LOG_AUTO_PURGE_DAYS=${LOG_AUTO_PURGE_DAYS:-0}
      - LOG_FILE=${LOG_FILE:-/var/log/reminder}
      - LOG_FORMAT=${LOG_FORMAT:-text}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - MAX_BODY_MB=${MAX_BODY_MB:-1}
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-}
      - LOGIN_MAX_ATTEMPTS=${LOGIN_MAX_ATTEMPTS:-5}
      - LOGIN_LOCKOUT_MINUTES=${LOGIN_LOCKOUT_MINUTES:-15}
      # 访问外部服务（如 Telegram）时的代理；留空表示直连
      - HTTPS_PROXY=${HTTPS_PROXY:-}