name: 质量门禁

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  backend:
    name: 后端检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: backend/go.sum

      # //go:embed web/* 要求该目录存在，否则 cmd/server 无法编译
      - name: 准备嵌入目录
        run: mkdir -p backend/cmd/server/web && touch backend/cmd/server/web/.gitkeep

      - name: 检查格式
        working-directory: backend
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "以下文件未格式化，请运行 gofmt -w . ："
            echo "$unformatted"
            exit 1
          fi

      - name: 静态检查
        working-directory: backend
        run: go vet ./...

      - name: 单元测试
        working-directory: backend
        run: go test ./... -race -count=1

  frontend:
    name: 前端检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        working-directory: frontend
        run: npm ci

      - name: 类型检查与构建
        working-directory: frontend
        run: npm run build

      - name: 单元测试
        working-directory: frontend
        run: npm test

  docs:
    name: 文档构建检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # VitePress 的 lastUpdated 依赖 git 提交时间
          fetch-depth: 0

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: 安装依赖
        working-directory: docs-site
        run: npm ci

      # 文档站点无法构建通常意味着链接写错或 Markdown 语法有问题
      - name: 构建文档站点
        working-directory: docs-site
        run: npm run docs:build
