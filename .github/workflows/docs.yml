name: 发布文档站点

on:
  push:
    branches: [main]
    paths:
      - 'docs-site/**'
      - '.github/workflows/docs.yml'
  # 允许在 Actions 页面手动触发
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个发布任务，避免并发写入 Pages
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: 构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-site
    steps:
      - name: 检出代码
        uses: actions/checkout@v5
        with:
          # VitePress 的 lastUpdated 依赖 git 提交时间
          fetch-depth: 0

      - name: 安装 Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 构建站点
        run: npm run docs:build

      # enablement: true 让 Actions 尝试自动创建 Pages 站点。
      # 若仓库 Settings → Pages 的 Source 尚未设为 "GitHub Actions"，
      # 且 GITHUB_TOKEN 无仓库管理员权限，这一步会失败，需要到设置页手动开启一次。
      - name: 配置 Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: 上传产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/.vitepress/dist

  deploy:
    name: 部署
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
